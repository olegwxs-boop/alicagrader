<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AlicaGrader - Upgrader Game</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0b0d17;
      --card-bg: rgba(22, 27, 46, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-purple: #8b5cf6;
      --accent-pink: #ec4899;
      --accent-emerald: #10b981;
      --accent-rose: #f43f5e;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 20px;
    }
    .header {
      background: rgba(15, 21, 37, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand-title {
      font-weight: 900;
      font-size: 1.2rem;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .user-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .balance-badge {
      color: #f59e0b;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .nav-tabs {
      display: flex;
      gap: 6px;
      padding: 12px 16px 0;
      overflow-x: auto;
    }
    .tab-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(236, 72, 153, 0.2));
      border-color: var(--accent-purple);
      color: #fff;
    }
    .main-content {
      padding: 16px;
      flex: 1;
    }
    .tab-page { display: none; }
    .tab-page.active { display: block; }
    .radar-wrapper {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 10px auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .radar-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    .radar-center {
      position: absolute;
      width: 140px;
      height: 140px;
      background: #111528;
      border-radius: 50%;
      border: 2px solid var(--card-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
      z-index: 2;
    }
    .roll-number {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: -0.5px;
    }
    .roll-status {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 4px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }
    .input-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .input-field {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 14px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      width: 100%;
    }
    .input-field:focus {
      border-color: var(--accent-purple);
    }
    .btn-primary {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
    }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .leader-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 12px;
      border-radius: 12px;
    }
    .leader-rank {
      font-weight: 800;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
    }
    .rank-1 { background: #f59e0b; color: #000; }
    .rank-2 { background: #9ca3af; color: #000; }
    .rank-3 { background: #d97706; color: #fff; }
    .tap-btn {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--accent-emerald);
      color: var(--accent-emerald);
      padding: 8px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand-title">
      <i class="fa-solid fa-bolt"></i> AlicaGrader
    </div>
    <div class="user-pill">
      <span id="userName">Игрок</span>
      <div class="balance-badge">
        <i class="fa-solid fa-coins"></i>
        <span id="userBalance">1000</span>
      </div>
    </div>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('game')"><i class="fa-solid fa-gamepad"></i> Апгрейдер</button>
    <button class="tab-btn" onclick="switchTab('leaderboard')"><i class="fa-solid fa-trophy"></i> Лидерборд</button>
  </div>

  <div class="main-content">
    <!-- ИГРА -->
    <div id="tab-game" class="tab-page active">
      <div class="radar-wrapper">
        <svg class="radar-svg" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(244,63,94,0.3)" stroke-width="8"/>
          <circle id="winArc" cx="50" cy="50" r="45" fill="none" stroke="#10b981" stroke-width="8" stroke-dasharray="0 283"/>
        </svg>
        <div class="radar-center">
          <div id="rollNum" class="roll-number">0.00</div>
          <div id="rollStatus" class="roll-status">Шанс 47.5%</div>
        </div>
      </div>

      <div class="card">
        <div class="input-group">
          <label>Ваша ставка (Монеты)</label>
          <input type="number" id="betInput" class="input-field" value="100" oninput="recalcChance()">
        </div>
        <div class="input-group">
          <label>Желаемая цель (Множитель / Монеты)</label>
          <input type="number" id="targetInput" class="input-field" value="200" oninput="recalcChance()">
        </div>
        <button id="rollBtn" class="btn-primary" onclick="playUpgrade()">АПГРЕЙДИТЬ</button>
        <button class="tap-btn" onclick="addBonusCoins()">⚡ Натапать +500 монет</button>
      </div>
    </div>

    <!-- ЛИДЕРБОРД -->
    <div id="tab-leaderboard" class="tab-page">
      <div class="card">
        <h3 style="margin-bottom:12px;"><i class="fa-solid fa-crown" style="color:#f59e0b"></i> Топ Игроков</h3>
        <div id="leaderboardList" class="leaderboard-list">
          <!-- Генерируется через JS -->
        </div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    // Локальное хранилище данных
    let state = {
      balance: parseInt(localStorage.getItem('alica_bal')) || 1000,
      name: tg?.initDataUnsafe?.user?.first_name || localStorage.getItem('alica_name') || 'Алиса',
      wins: parseInt(localStorage.getItem('alica_wins')) || 0
    };

    // Лидерборд
    let leaders = [
      { name: "Александр", balance: 15400 },
      { name: "Дмитрий", balance: 8900 },
      { name: "Елена", balance: 4200 },
      { name: state.name, balance: state.balance }
    ];

    function saveState() {
      localStorage.setItem('alica_bal', state.balance);
      localStorage.setItem('alica_name', state.name);
      localStorage.setItem('alica_wins', state.wins);
      document.getElementById('userBalance').innerText = state.balance;
      updateLeaderboard();
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
      event.currentTarget.classList.add('active');
      document.getElementById('tab-' + tab).classList.add('active');
    }

    function recalcChance() {
      const bet = parseFloat(document.getElementById('betInput').value) || 0;
      const target = parseFloat(document.getElementById('targetInput').value) || 0;
      if (bet <= 0 || target <= bet) {
        document.getElementById('rollStatus').innerText = "Неверная цель";
        return 0;
      }
      const winChance = Math.min(95, Math.max(1, ((bet / target) * 95).toFixed(2)));
      document.getElementById('rollStatus').innerText = `Шанс ${winChance}%`;
      
      const arc = document.getElementById('winArc');
      const circumference = 2 * Math.PI * 45;
      const dash = (winChance / 100) * circumference;
      arc.setAttribute('stroke-dasharray', `${dash} ${circumference}`);
      return winChance;
    }

    function playUpgrade() {
      const bet = parseFloat(document.getElementById('betInput').value) || 0;
      const target = parseFloat(document.getElementById('targetInput').value) || 0;
      const chance = recalcChance();

      if (bet > state.balance) {
        alert("Недостаточно монет! Нажмите кнопку снизу, чтобы натапать ещё.");
        return;
      }
      if (chance <= 0) return;

      state.balance -= bet;
      saveState();

      const btn = document.getElementById('rollBtn');
      btn.disabled = true;

      let elapsed = 0;
      const interval = setInterval(() => {
        const tempRoll = (Math.random() * 100).toFixed(2);
        document.getElementById('rollNum').innerText = tempRoll;
        elapsed += 50;

        if (elapsed >= 1500) {
          clearInterval(interval);
          const finalRoll = (Math.random() * 100).toFixed(2);
          document.getElementById('rollNum').innerText = finalRoll;

          if (parseFloat(finalRoll) <= chance) {
            state.balance += target;
            state.wins += 1;
            alert(`🎉 Победа! Вы выиграли ${target} монет!`);
          } else {
            alert(`💥 Неудача! Число ${finalRoll} больше чем ${chance}%`);
          }
          saveState();
          btn.disabled = false;
        }
      }, 50);
    }

    function addBonusCoins() {
      state.balance += 500;
      saveState();
    }

    function updateLeaderboard() {
      const myEntry = leaders.find(l => l.name === state.name);
      if (myEntry) myEntry.balance = state.balance;
      leaders.sort((a, b) => b.balance - a.balance);

      const listEl = document.getElementById('leaderboardList');
      listEl.innerHTML = '';
      leaders.forEach((item, index) => {
        const rankClass = index === 0 ? 'rank-1' : index === 1 ? 'rank-2' : index === 2 ? 'rank-3' : '';
        listEl.innerHTML += `
          <div class="leader-item">
            <div style="display:flex; align-items:center; gap:10px;">
              <div class="leader-rank ${rankClass}">${index + 1}</div>
              <span>${item.name}</span>
            </div>
            <strong style="color:#f59e0b">${item.balance} 🪙</strong>
          </div>
        `;
      });
    }

    // Инициализация
    document.getElementById('userName').innerText = state.name;
    saveState();
    recalcChance();
  </script>
</body>
</html>
